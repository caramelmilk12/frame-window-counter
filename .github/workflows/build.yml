name: Build Geode Mod

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          # Windows
          - os: windows-latest
            platform: win
            extra-cmake-args: "-DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl"

          # Android
          - os: ubuntu-latest
            platform: android32
            extra-cmake-args: ""
          - os: ubuntu-latest
            platform: android64
            extra-cmake-args: ""

          # macOS & iOS
          - os: macos-latest
            platform: mac-arm
            extra-cmake-args: ""
          - os: macos-latest
            platform: mac-intel
            extra-cmake-args: ""
          - os: macos-latest
            platform: ios
            extra-cmake-args: ""

    runs-on: ${{ matrix.config.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          bindings: geode-sdk/bindings
          bindings-ref: main
          combine: true
          platform: ${{ matrix.config.platform }}
          extra-cmake-args: ${{ matrix.config.extra-cmake-args }}